name: ServiceFlow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The job name "validate" is a required status check in the Main Branch
  # Protection ruleset. Do not rename it or turn it into a matrix.
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      - name: Install locked dependencies (fails if uv.lock is out of date)
        run: uv sync --locked --extra dev --python 3.12
      - name: Lint (required)
        run: uv run --locked --extra dev ruff check .
      - name: Tests on Python 3.12, development mode, resource leaks fail (required)
        run: uv run --locked --extra dev python -X dev -m pytest -q
      - name: Tests on oldest supported Python, 3.11 (required)
        run: uv run --locked --isolated --extra dev --python 3.11 python -X dev -m pytest -q
      - name: Tests on newest tested Python, 3.13 (required)
        run: uv run --locked --isolated --extra dev --python 3.13 python -X dev -m pytest -q

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serviceflow-reference"
version = "0.3.0"
description = "Educational AI-native engineering companion to Justin Underhill's playbook"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.28,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools]
packages = ["serviceflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Fail on any resource leak, such as an unclosed SQLite connection. Leaks found
# during garbage collection surface as PytestUnraisableExceptionWarning.
# Other warnings (e.g. third-party deprecations) are still shown but do not fail.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
